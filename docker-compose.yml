services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - /tmp/postgres/data:/var/lib/postgresql/data
    networks:
      - traefik_traefik-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokploy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dokploy Application (pre-built image from Docker Hub)
  dokploy:
    image: dokploy/dokploy:v0.30.8
    container_name: dokploy
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      NODE_ENV: "production"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dokploy.rule=Host(`dokploy.${BASE_DOMAIN:?Set BASE_DOMAIN in .env}`)"
      - "traefik.http.routers.dokploy.entrypoints=websecure"
      - "traefik.http.routers.dokploy.tls=true"
      - "traefik.http.routers.dokploy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dokploy.tls.certresolver.domains.main=baipoker.com"
      - "traefik.http.services.dokploy.loadbalancer.server.port=3001"
    env_file:
      - ./.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traefik_traefik-net

networks:
  traefik_traefik-net:
    external: true